name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.scope.outputs.python }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 -B tools/ci/checks.py changes --base "$BASE_SHA"

  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.14.14 PyYAML==6.0.3
      - run: python -B -m unittest discover -s tools/ci -p 'test_*.py' -v
      - run: python -B tools/ci/checks.py repository --base "$BASE_SHA"
      - run: python -B tools/ci/checks.py lint --base "$BASE_SHA"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt -c docs/development-baseline/validation-requirements.lock.txt
      # test_public_candidate_identity.py renders the real frontend/src/App.tsx with Node.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@10.18.3
      - run: pnpm --dir frontend install --frozen-lockfile
      # The whole backend/tests directory; the standalone-only files that conftest excludes run in the standalone job.
      - name: Backend pytest regressions (temp SQLite only, no source GET)
        shell: bash
        working-directory: backend
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -B -m pytest -p no:cacheprovider -q -rA tests

  # Every file in backend/tests/conftest.py STANDALONE_ONLY runs by its documented command
  # (docs/development-baseline/README.md standalone-only table). Modes that need a fixed or private root,
  # a listening server, a seal or a real GET are not run; each is noted next to its command.
  standalone:
    name: standalone
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt -c docs/development-baseline/validation-requirements.lock.txt
      - name: Standalone-only tests (RAM fixtures and fake transports, no source GET, DB or files)
        shell: bash
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        run: |
          # GitHub starts bash with -e; keep going after a failure so one run reports every failing file.
          set +e -uo pipefail
          status=0
          run() {
            echo "::group::$*"
            "$@" || { echo "::error::standalone command failed: $*"; status=1; }
            echo "::endgroup::"
          }
          # Single mode (no argv branch).
          run python -B -X utf8 backend/tests/test_conditional_plan_store.py
          # Default mode runs the whole memory suite; --memory-storage is a subset of it. Not run: --disk, --prepare,
          # --inspect, --cleanup (the fixed LOCALAPPDATA/Temp owned root and its cross-process steps) and --serve (listening server).
          # It imports `app` without adding backend/ to sys.path, so this one command carries PYTHONPATH=backend.
          PYTHONPATH=backend run python -B -X utf8 backend/tests/test_share_quantity_storage.py
          exit "$status"

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@10.18.3
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run test:ci
      - run: pnpm --dir frontend run build

  required:
    name: required
    if: always()
    needs: [changes, repository, backend, standalone, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every applicable check to succeed
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', jobs
          assert jobs['repository']['result'] == 'success', jobs
          for job, flag in [('backend', 'python'), ('standalone', 'python'), ('frontend', 'frontend')]:
              required = jobs['changes']['outputs'].get(flag)
              assert required in ('true', 'false'), jobs
              expected = 'success' if required == 'true' else 'skipped'
              assert jobs[job]['result'] == expected, jobs
          print('All applicable CI checks passed; local QA is a separate requirement.')
          PY
