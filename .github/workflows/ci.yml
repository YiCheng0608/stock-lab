name: CI

on:
  # master, the V1 release branch and the long-lived integration branches (#332; none now);
  # tools/ci/test_checks.py (WorkflowTriggers) pins both lists to master, release/** and
  # integration_branches in tools/ops/close_task.sh.
  pull_request:
    branches: [master, 'release/**']
    # edited and (un)labeled rerun the pr gate when the body or labels change.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [master, 'release/**']
  # Master's full suite every night (22:40 Taipei) and on demand: changes, backend and
  # frontend run on every file, verify on all five pages (verify_plan.py --event, #251).
  schedule:
    - cron: '40 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  # A schedule or workflow_dispatch event has neither: the all-zero SHA means every file.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    # The whole-history checkout has taken 5 minutes (tools/ci/test_checks.py CheckoutTime).
    timeout-minutes: 10
    outputs:
      python: ${{ steps.scope.outputs.python }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 -B tools/ci/checks.py changes --base "$BASE_SHA"

  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.14.14 PyYAML==6.0.3
      - name: unittest
        run: python -B -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: agent guard hook
        run: node --test tools/ops/agent_guard.test.cjs
      - name: repository
        run: python -B tools/ci/checks.py repository --base "$BASE_SHA"
      # Whole backend/ and tools/ trees with the root ruff.toml (ruff check and ruff format --check).
      - name: lint
        run: python -B tools/ci/checks.py lint --base "$BASE_SHA"

  # PR body, labels and commit messages (tools/ci/checks.py pr). The event fields go through
  # env: so their text is never part of the shell script.
  pr:
    name: pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # The whole-history checkout has taken 5 minutes (tools/ci/test_checks.py CheckoutTime).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The base branch tip as fetched now, not BASE_SHA: pull_request.base.sha stays at its
      # old value after master moves, and an edited/labeled rerun checks out a merge ref that
      # already contains master's newer commits. checks.py diffs from the merge-base.
      - name: pr
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 -B tools/ci/checks.py pr --base "$(git rev-parse "refs/remotes/origin/$BASE_REF")"

  # The whole backend/tests directory on every core with pytest-xdist (#442), after a week
  # beside the serial job with the same results (#379). A failing, erroring or hung pytest
  # fails the job, and required with it.
  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    # The pytest step took 462 seconds at the median and 669 at the slowest in #379's week
    # (108 runs), 706 in PR #446's first run, and has 20 minutes (about 1.7 times 706), so a
    # hang still leaves the Summary step time to run;
    # 10 more for the checkout (5 minutes at its slowest, CheckoutTime), setup and pip
    # (tools/ci/test_checks.py BackendTime).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      # pytest-xdist and execnet are pinned here, not in the lock: only this job runs in
      # parallel. The lock also builds the backend image and the release venv, whose pytest
      # (the manual's local checks) stays serial.
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt -c backend/validation-requirements.lock.txt pytest-xdist==3.8.0 execnet==2.1.1
      # The runner the durations below were measured on (#374).
      - name: Runner spec
        run: |
          nproc
          free -g
      # --durations=30 puts the slowest tests in the log (#374). --dist loadgroup runs the
      # tests marked with one xdist_group on one worker, one after another. The suite_split
      # plugin only records what ran (tools/ci/suite_split.py, #378), written by xdist's
      # controller; the suite job checks it with the docker job's report.
      - name: Backend pytest regressions (temp SQLite only, no source GET)
        id: pytest
        timeout-minutes: 20
        shell: bash
        working-directory: backend
        env:
          LOCALAPPDATA: ${{ runner.temp }}
          PYTHONPATH: ${{ github.workspace }}/tools/ci
        run: |
          set -euo pipefail
          # In files as well: a step killed at its time limit may not get its outputs through.
          nproc > "$RUNNER_TEMP/pytest.workers"
          date +%s > "$RUNNER_TEMP/pytest.start"
          echo "workers=$(nproc)" >> "$GITHUB_OUTPUT"
          start=$(date +%s)
          trap 'echo "seconds=$(($(date +%s) - start))" >> "$GITHUB_OUTPUT"' EXIT
          python -B -m pytest -p no:cacheprovider -p suite_split --suite-report "$RUNNER_TEMP/suite/backend.json" \
            -q -rA --durations=30 -n "$(nproc)" --dist loadgroup --junitxml "$RUNNER_TEMP/pytest.xml" tests
      # The step summary and one notice annotation carry the time, the worker count and the
      # failed and error test ids, with the same keys whatever happened (#379's comparisons
      # read them). It runs after a red or hung pytest too.
      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
          WORKERS: ${{ steps.pytest.outputs.workers }}
          ELAPSED: ${{ steps.pytest.outputs.seconds }}
        run: |
          python3 - <<'PY'
          import json, os, time
          import xml.etree.ElementTree as ET
          temp = os.environ['RUNNER_TEMP']

          def number(value):
              try:
                  return int(str(value).strip())
              except ValueError:
                  return None

          def read(name):
              try:
                  with open(os.path.join(temp, name), encoding='utf-8') as f:
                      return f.read()
              except OSError:
                  return ''

          # Without the step's output (killed at the time limit), from its start file.
          seconds = number(os.environ['ELAPSED'])
          if seconds is None and (start := number(read('pytest.start'))) is not None:
              seconds = int(time.time()) - start
          workers = number(os.environ['WORKERS'])
          if workers is None:
              workers = number(read('pytest.workers'))
          # Every key is there whatever happened; null where the junit XML has no value.
          keys = ('tests', 'failures', 'errors', 'skipped')
          counts = dict.fromkeys(keys)
          ids = {'failure': [], 'error': []}
          try:
              root = ET.parse(os.path.join(temp, 'pytest.xml')).getroot()
          except (OSError, ET.ParseError):
              root = None
          if root is not None:
              counts = dict.fromkeys(keys, 0)
              for suite in root.iter('testsuite'):
                  for key in keys:
                      counts[key] += number(suite.get(key, 0)) or 0
              for case in root.iter('testcase'):
                  test_id = f"{case.get('classname', '')}::{case.get('name', '')}"
                  for kind in ids:
                      if case.find(kind) is not None:
                          ids[kind].append(test_id)
          result = {'outcome': os.environ['OUTCOME'] or None, 'seconds': seconds,
                    'workers': workers, **counts,
                    'failed': ids['failure'], 'error': ids['error']}
          line = json.dumps(result, ensure_ascii=False)
          # An annotation holds 64 KB: the first 20 ids of each kind; the summary has them all.
          short = {**result, 'failed': ids['failure'][:20], 'error': ids['error'][:20]}
          # Workflow command escaping of the message: % first, then CR and LF.
          message = json.dumps(short, ensure_ascii=False)
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::notice title=backend::{message}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## backend (#442)\n\n| outcome | seconds | workers | tests | failures | errors | skipped |\n')
              out.write('| --- | --- | --- | --- | --- | --- | --- |\n')
              cells = [result[k] for k in ('outcome', 'seconds', 'workers', *keys)]
              out.write('| ' + ' | '.join('' if c is None else str(c) for c in cells) + ' |\n\n')
              for kind, label in (('failed', 'Failed'), ('error', 'Error')):
                  out.write(f'{label} ({len(result[kind])}):\n\n')
                  out.writelines(f'- `{test_id}`\n' for test_id in result[kind])
                  out.write('\n')
              out.write(f'```json\n{line}\n```\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-backend
          path: ${{ runner.temp }}/suite/backend.json
          if-no-files-found: error
          retention-days: 14
  # The backend image (backend/Dockerfile, #333): build it, then in a container the tools it
  # must hold, every app and worker module importing (a dependency missing from the image
  # fails here), one screenshot of a local page with tools/ops/screenshot.cjs (its memory peak
  # from the container's cgroup) and the tests that depend on the image's environment (#378).
  # The backend job runs the whole of backend/tests on the runner; this job runs only what
  # tools/ci/docker_suite.json lists, and the suite job fails CI if any test of the suite ran
  # in neither. The tests read git history (KNOWN_FAILURES dates), so the checkout's .git is
  # mounted read-only; the image has none.
  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # shell: bash runs with -o pipefail, so a failing command piped to tee fails its step.
    defaults:
      run:
        shell: bash
    env:
      IMAGE: stock-lab-backend:ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: docker build
        run: docker build -f backend/Dockerfile -t "$IMAGE" .
      - name: Image size
        run: |
          docker image inspect "$IMAGE" --format 'size_bytes={{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' "$IMAGE" | cut -c1-160
      - name: Tools in the container
        run: |
          docker run --rm "$IMAGE" bash -c '
            set -eux
            python -c "import app, worker" && echo "import app, worker: ok"
            gh --version
            claude --version
            node --version
            chromium --version
            date "+%F %T %Z %z"
            cat ~/.claude.json
            id
            cat /proc/1/cmdline | tr "\0" " "; echo'
      # python -c "import app, worker" above reaches two docstring-only __init__.py files; this
      # imports every module, so a dependency only a submodule needs (httpx) must be in the image.
      - name: Import every app and worker module
        run: docker run --rm "$IMAGE" python -B tools/ci/import_modules.py
      - name: Screenshot in the container
        run: |
          docker run --rm "$IMAGE" bash -c '
            set -eu
            mkdir -p /tmp/page
            printf "<!doctype html><meta charset=utf-8><meta name=viewport content=width=device-width><title>stock-lab</title><main>stock-lab 截圖測試</main>\n" > /tmp/page/index.html
            python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/page > /tmp/http.log 2>&1 &
            curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8765/
            node tools/ops/screenshot.cjs --url http://127.0.0.1:8765/ --out /tmp/shot --name local --widths 1280,390
            ls -l /tmp/shot
            cat /tmp/shot/local-1280.txt
            echo "memory_peak_bytes=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown)"' | tee -a "$GITHUB_STEP_SUMMARY"
      # The list is tools/ci/docker_suite.json. The whole suite is also collected, not run, so the
      # suite job compares both jobs with the suite as the image sees it. /suite is where the
      # reports go: the container's user (uid 1000) is not the runner's, hence chmod.
      - name: pytest in the container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suite"
          chmod 777 "$RUNNER_TEMP/suite"
          python3 -B tools/ci/suite_split.py args --prefix backend/ > "$RUNNER_TEMP/suite/selectors.txt"
          mapfile -t selectors < "$RUNNER_TEMP/suite/selectors.txt"
          test "${#selectors[@]}" -gt 0
          pytest=(docker run --rm -v "$PWD/.git:/app/.git:ro" -v "$RUNNER_TEMP/suite:/suite" -e PYTHONPATH=/app/backend:/app/tools/ci "$IMAGE" python -B -m pytest -p no:cacheprovider -p suite_split)
          "${pytest[@]}" -qq --collect-only --suite-report /suite/image-collect.json backend/tests
          "${pytest[@]}" -q -rA --suite-report /suite/docker.json "${selectors[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-docker
          path: |
            ${{ runner.temp }}/suite/docker.json
            ${{ runner.temp }}/suite/image-collect.json
          if-no-files-found: error
          retention-days: 14

  # Every test of backend/tests ran in the backend job or in the docker job, or is listed in
  # tools/ci/docker_suite.json as skipped everywhere (#378). Collecting proves nothing here, as
  # the backend job collects the whole suite: the check is on what passed. Not run when either
  # job failed (required is red then anyway).
  suite:
    name: suite
    needs: [changes, backend, docker]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # shell: bash runs with -o pipefail, so a failing check piped to tee fails its step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-*
          merge-multiple: true
          path: ${{ runner.temp }}/suite
      - name: suite
        run: |
          python3 -B tools/ci/suite_split.py verify \
            --backend "$RUNNER_TEMP/suite/backend.json" \
            --docker "$RUNNER_TEMP/suite/docker.json" \
            --image "$RUNNER_TEMP/suite/image-collect.json" | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@10.18.3
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run test:ci
      - run: pnpm --dir frontend run build

  # The frontend image (frontend/Dockerfile, #334): the nginx stage and the dev target build;
  # test:ci and build pass in the dev container; frontend/docker/smoke.sh checks the pages,
  # the single-page fallback, that /api reaches the upstream with the browser's Host and that
  # nothing in the web container runs as root; frontend/docker/context_check.sh that
  # frontend/.dockerignore keeps secrets, dependencies and build output out at any depth.
  frontend-image:
    name: frontend-image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # shell: bash runs with -o pipefail, so a failing script piped to tee fails its step.
    defaults:
      run:
        shell: bash
    env:
      WEB_IMAGE: stock-lab-web:ci
      DEV_IMAGE: stock-lab-web-dev:ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: docker build
        run: |
          docker build -t "$WEB_IMAGE" frontend
          docker build --target dev -t "$DEV_IMAGE" frontend
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':ci ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: test:ci and build in the dev container
        run: |
          docker run --rm "$DEV_IMAGE" pnpm run test:ci
          docker run --rm "$DEV_IMAGE" pnpm run build
      - name: smoke
        run: bash frontend/docker/smoke.sh "$WEB_IMAGE" "$DEV_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: build context
        run: bash frontend/docker/context_check.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # docker-compose.yml and docker-compose.dev.yml (#335): tools/compose/smoke.sh builds the
  # images, then in both topologies (nginx web; Vite web calling the api) checks health, writes
  # sent as a browser sends them (2xx) and from a foreign Origin (403), the ports the entrypoint
  # refuses, the api's restart, the scheduler's serve, and that the env file reaches the api and
  # the scheduler while both still start without one. tools/compose/deploy_smoke.sh then deploys
  # two tags with tools/ops/deploy.sh (#340): the services run the tagged images, a deploy
  # refused while a job holds a lock changes no image, container or volume and leaves the job
  # holding it (#430).
  compose:
    name: compose
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # shell: bash runs with -o pipefail, so a failing script piped to tee fails its step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: docker compose version
      - name: smoke
        run: bash tools/compose/smoke.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: deploy
        run: bash tools/compose/deploy_smoke.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # The five main pages end to end on the fixture database (tools/verify/page_checks.py, #243):
  # API and vite preview on local ports, Chrome screenshots, every features check labeled CI.
  # Only the pages the change needs (tools/verify/verify_plan.py, #245); with none, every later
  # step is skipped and the job still succeeds, so required's assertion holds. The nightly and
  # manual runs verify all five pages (#251).
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      API_PORT: '18000'
      WEB_PORT: '14000'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request diffs from the merge-base with the base branch tip as fetched now (see the pr job).
      - name: Plan
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          base="$BASE_SHA"
          if [ -n "$BASE_REF" ]; then base="$(git rev-parse "refs/remotes/origin/$BASE_REF")"; fi
          python3 -B tools/verify/verify_plan.py --base "$base" --event "$GITHUB_EVENT_NAME" --output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.plan.outputs.pages != ''
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.plan.outputs.pages != ''
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install
        if: steps.plan.outputs.pages != ''
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt -c backend/validation-requirements.lock.txt
          npm install --global pnpm@10.18.3
          pnpm --dir frontend install --frozen-lockfile
          echo "V=$RUNNER_TEMP/verify" >> "$GITHUB_ENV"
      # The runner has no CJK monospace font; without it the screenshots show boxes (the text checks
      # do not care). A bare apt-get took 12 to over 15 minutes three times on 2026-11-04 (#489):
      # the package's files come from the cache, and apt runs only on a miss, each command under
      # its own limit, failing with a diagnosis (tools/verify/install_fonts.sh). The cache steps
      # only save time, so a slow or broken cache falls through to apt.
      - name: Restore fonts
        id: fonts-cache
        if: steps.plan.outputs.pages != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/verify-fonts
          key: verify-fonts-noto-cjk-ubuntu-24.04-v1
      - name: Fonts
        if: steps.plan.outputs.pages != ''
        timeout-minutes: 10
        run: bash tools/verify/install_fonts.sh --cache "$HOME/.cache/verify-fonts" --log "$V/logs/fonts.log"
      - name: Save fonts
        if: steps.plan.outputs.pages != '' && steps.fonts-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/verify-fonts
          key: verify-fonts-noto-cjk-ubuntu-24.04-v1
      - name: Fixture database
        if: steps.plan.outputs.pages != ''
        run: |
          mkdir -p "$V/logs"
          python -B tools/verify/fixture_db.py --dest "$V/db" > "$V/logs/fixture.json"
      - name: Build frontend
        if: steps.plan.outputs.pages != ''
        working-directory: frontend
        env:
          VITE_API_BASE: /api
        run: node node_modules/vite/bin/vite.js build --outDir "$V/dist" --emptyOutDir > "$V/logs/build.log" 2>&1
      # Both servers outlive this step; the runner stops them when the job ends.
      - name: Start API and preview
        if: steps.plan.outputs.pages != ''
        run: |
          STOCK_DATA_DIR="$V/db" STOCK_DB_PATH="$V/db/stock.db" STOCK_RAW_DIR="$V/db/raw" PYTHONPATH=backend \
            nohup python -B -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port "$API_PORT" > "$V/logs/api.log" 2>&1 &
          (cd frontend && VERIFY_DIST="$V/dist" VERIFY_WEB_PORT="$WEB_PORT" VERIFY_API_URL="http://127.0.0.1:$API_PORT" \
            nohup node node_modules/vite/bin/vite.js preview --config ../tools/verify/vite.preview.mjs > "$V/logs/preview.log" 2>&1 &)
          curl -fsS -o /dev/null --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors "http://127.0.0.1:$API_PORT/api/health"
          curl -fsS -o /dev/null --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors "http://127.0.0.1:$WEB_PORT/api/health"
      - name: Checks
        if: steps.plan.outputs.pages != ''
        timeout-minutes: 8
        env:
          PAGES: ${{ steps.plan.outputs.pages }}
        run: >-
          python -B tools/verify/page_checks.py --fixture --db "$V/db/stock.db" --out "$V/out"
          --api "http://127.0.0.1:$API_PORT" --web "http://127.0.0.1:$WEB_PORT" --pages "$PAGES"
      - name: Summary
        if: always() && steps.plan.outputs.pages != ''
        run: |
          if [ -f "$V/out/summary.md" ]; then cat "$V/out/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          tail -n 20 "$V/logs/api.log" "$V/logs/preview.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.pages != ''
        with:
          name: verify-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verify/out
            ${{ runner.temp }}/verify/logs
          if-no-files-found: warn
          retention-days: 14

  required:
    name: required
    if: always()
    needs: [changes, repository, pr, backend, docker, suite, frontend, frontend-image, compose, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads the runs of this workflow to tell a run cancelled for a newer one (#421).
    permissions:
      actions: read
    env:
      RESULTS: ${{ toJSON(needs) }}
      EVENT: ${{ github.event_name }}
      TOKEN: ${{ github.token }}
    # Opening a PR and labeling it start two runs on one head, and concurrency cancels the
    # first; always() still runs required there. A needs failure is always red. A cancelled
    # run passes only when another run of the same workflow, PR and head, created no
    # earlier and not cancelled, exists, whose own required then decides; otherwise it
    # stays red (tools/ci/test_checks.py RequiredJob).
    steps:
      - name: Require every applicable check to succeed
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          jobs = json.loads(os.environ['RESULTS'])
          failed = sorted(name for name, job in jobs.items() if job['result'] == 'failure')
          assert not failed, f'failed: {failed}'
          cancelled = sorted(name for name, job in jobs.items() if job['result'] == 'cancelled')
          if cancelled:
              assert os.environ['EVENT'] == 'pull_request', f'cancelled: {cancelled}'
              def get(path):
                  url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/{path}"
                  headers = {'Authorization': f"Bearer {os.environ['TOKEN']}", 'Accept': 'application/vnd.github+json'}
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      return json.load(response)
              run_id = int(os.environ['GITHUB_RUN_ID'])
              run = get(f'actions/runs/{run_id}')
              prs = {pr['number'] for pr in run['pull_requests']}
              runs = get(f"actions/workflows/{run['workflow_id']}/runs?event=pull_request&head_sha={run['head_sha']}&per_page=100")
              # Another run of the same workflow, PR and head, created no earlier than this one
              # and not cancelled, is the one concurrency kept. Ids do not order runs created
              # the same second: in PR #432 the higher id was the one cancelled.
              kept = sorted(
                  other['id'] for other in runs['workflow_runs']
                  if other['id'] != run_id
                  and other.get('conclusion') != 'cancelled'
                  and other['created_at'] >= run['created_at']
                  and other['workflow_id'] == run['workflow_id']
                  and other['head_sha'] == run['head_sha']
                  and prs & {pr['number'] for pr in other['pull_requests']}
              )
              assert kept, f"cancelled: {cancelled}; no other run of PR {sorted(prs)} on {run['head_sha']} goes on"
              print(f'Cancelled for run {kept[-1]} of the same PR head; its required decides.')
              raise SystemExit(0)
          assert jobs['changes']['result'] == 'success', jobs
          assert jobs['repository']['result'] == 'success', jobs
          assert jobs['verify']['result'] == 'success', jobs
          pr = 'success' if os.environ['EVENT'] == 'pull_request' else 'skipped'
          assert jobs['pr']['result'] == pr, jobs
          for job, flag in [('backend', 'python'), ('docker', 'python'), ('suite', 'python'), ('frontend', 'frontend'), ('frontend-image', 'frontend')]:
              required = jobs['changes']['outputs'].get(flag)
              assert required in ('true', 'false'), jobs
              expected = 'success' if required == 'true' else 'skipped'
              assert jobs[job]['result'] == expected, jobs
          flags = jobs['changes']['outputs']
          compose = 'success' if 'true' in (flags.get('python'), flags.get('frontend')) else 'skipped'
          assert jobs['compose']['result'] == compose, jobs
          print('All applicable CI checks passed; local QA is a separate requirement.')
          PY
