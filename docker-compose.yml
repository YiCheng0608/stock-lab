# The compose base (#335, parent #331): api, web and scheduler on the images of
# backend/Dockerfile (#333) and frontend/Dockerfile (#334). docker-compose.dev.yml on top of it
# is the development setup. Commands and the variables below: docs/OPERATIONS.md §1.2.
#
# - Host ports, on 127.0.0.1 only: WEB_PORT (default 8080) for the pages, API_PORT (default
#   8000) for the API. Two checkouts running at once need their own pair and project name
#   (`-p`); images, containers and the stock-data volume all carry the project name.
# - env_file: STOCK_ENV_FILE, default .env in this directory (made by hand from .env.example,
#   never in Git). Without it the api and the scheduler start with no tokens (#337), so
#   `claude -p` and gh fail at their steps. `required: false` needs Compose 2.24 or later.
# - The data directory is the named volume stock-data at /data (stock.db, logs, exports), never
#   a bind mount. The api refuses to start on an empty one until init-db or a copied DB fills it.
# - Image tags: STOCK_RELEASE_TAG, default latest. tools/ops/deploy.sh sets it to the git tag it
#   deploys (docs/RELEASE.md, #340), so `docker compose ps` names the version; a project run
#   without it uses `<project>-backend:latest` and `<project>-web:latest`.

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    # What schedule_runs records of the code (docs/OPERATIONS.md §6.6); compose cannot read
    # git, so STOCK_GIT_HEAD comes from the shell: STOCK_GIT_HEAD="$(git rev-parse HEAD)".
    args:
      STOCK_IMAGE_TAG: ${COMPOSE_PROJECT_NAME}-backend:${STOCK_RELEASE_TAG:-latest}
      STOCK_GIT_HEAD: ${STOCK_GIT_HEAD:-}
  image: ${COMPOSE_PROJECT_NAME}-backend:${STOCK_RELEASE_TAG:-latest}
  entrypoint: ["/usr/bin/tini", "--", "/app/backend/docker/entrypoint.sh"]
  env_file:
    - path: ${STOCK_ENV_FILE:-.env}
      required: false
  volumes:
    - stock-data:/data
  restart: unless-stopped

# Set here, so a Windows path or another zone in the env file cannot reach the containers.
x-backend-environment: &backend-environment
  TZ: Asia/Taipei
  STOCK_DATA_DIR: /data
  STOCK_DB_PATH: /data/stock.db
  STOCK_RAW_DIR: /data/raw

services:
  api:
    <<: *backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
      # Checked by the entrypoint (80 and WEB_PORT 8000 are refused).
      WEB_PORT: ${WEB_PORT:-8080}
      API_PORT: ${API_PORT:-8000}
      # The Host a browser sends through the web container's /api (localhost:WEB_PORT) and
      # straight to the published API port (docs/OPERATIONS.md §1.1).
      STOCK_API_PUBLIC_HOSTS: localhost:${WEB_PORT:-8080},127.0.0.1:${WEB_PORT:-8080},localhost:${API_PORT:-8000},127.0.0.1:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: frontend
      target: web
    image: ${COMPOSE_PROJECT_NAME}-web:${STOCK_RELEASE_TAG:-latest}
    environment:
      TZ: Asia/Taipei
      API_UPSTREAM: api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # daily, news and the watchdog on Taipei time (docs/OPERATIONS.md §6.6). No hostname: a fixed
  # one would let a row without the job's lock be judged by host and PID across PID
  # namespaces (#336 review, suggestion 3).
  scheduler:
    <<: *backend
    command: ["python", "-m", "worker.cli", "serve"]
    environment:
      <<: *backend-environment
    # A daily on a copy of the production DB peaked at about 0.95 GB rss (docs/OPERATIONS.md §1.2).
    mem_limit: 2g

volumes:
  stock-data:
